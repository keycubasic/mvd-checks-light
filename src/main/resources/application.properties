# smallrye
quarkus.resteasy.path=/mvd-checks
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/mvd-checks/swagger-ui
quarkus.swagger-ui.urls-primary-name=/mvd-checks/openapi
quarkus.smallrye-openapi.path=/mvd-checks/openapi

#non-app path
quarkus.http.non-application-root-path=/

# vert.x
# quarkus.vertx.worker-pool-size=1
quarkus.vertx.max-worker-execute-time=3H

# datasource
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=oracle.jdbc.driver.OracleDriver
quarkus.datasource.username=sogins
quarkus.datasource.password=1
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@mvd_db

# transaction
quarkus.transaction-manager.default-transaction-timeout=PT3H

# hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.OracleDialect
quarkus.hibernate-orm.validate-in-dev-mode=false

# scheduler
quarkus.scheduler.metrics.enabled=true
quarkus.scheduler.cron-type=unix

